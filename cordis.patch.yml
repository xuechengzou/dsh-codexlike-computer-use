# dsh bundle patch：把本插件插入 profile 的层栈。
#
# 本插件是纯增量插件：不替换任何官方服务，只新增 `computer` 工具、
# 一段系统提示词，并在存在 computer-use 服务时占用其 provider 槽位。
#
# 安装命令（任选其一）：
#   dsh plugin --profile web add dsh-computer-use
#   dsh plugin --profile web add file:E:/path/to/dsh-computer-use
#
# 逐会话配置写在 profile 的 cordis.patch.yml 里覆盖本行的 config，例如：
#   - id: computer-use
#     config:
#       allowInput: false
- insert:
    - id: computer-use
      name: 'dsh-computer-use'
